name: kith
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  # Typed routing. auto_route is the project's ONLY codegen dependency.
  auto_route: ^11.1.0

  # Injectable time source; every "now" read goes through clockProvider.
  clock: ^1.1.2

  # Firebase. Project kith-hawkstreak; the generated platform config lives in
  # lib/firebase_options.dart and is rewritten by `flutterfire configure`.
  # Kept in alphabetical order with everything else, so cupertino_icons sits
  # between the two halves of this group.
  cloud_firestore: ^6.8.0
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0

  flutter:
    sdk: flutter

  # The weekly digest. A local notification rather than a push: the digest is
  # computed from data the device already has, so there is nothing for a
  # server to know that the phone does not.
  flutter_contacts: ^2.3.1
  flutter_local_notifications: ^22.3.0

  # Localization. gen-l10n is the second approved codegen after AutoRoute: ARB
  # files in lib/l10n/ are the source of truth, generated classes land in
  # lib/l10n/gen/ (excluded from lints and coverage, never hand-edited).
  flutter_localizations:
    sdk: flutter

  # State management: classic providers only, no codegen.
  #
  # Held at 3.3.x deliberately. riverpod_lint 3.1.4 is the newest release whose
  # analyzer constraint resolves alongside auto_route_generator, and it pins
  # riverpod exactly. Bumping this to 3.4.x drops riverpod_lint entirely.
  flutter_riverpod: ^3.3.2

  # The device's IANA timezone name, over a platform channel. The `timezone`
  # package ships the database but has no way to ask the phone which zone it
  # is in, so this is what turns "Sunday at 9" into an instant the scheduler
  # can fire on. Named by flutter_local_notifications' own README as the way
  # to do it.
  flutter_timezone: ^5.1.0

  # Federated sign-in. 7.x splits authentication (an id token, for Firebase)
  # from authorization (access tokens for scopes), which is what lets M5 ask
  # for the calendar scope without a second sign-in.
  google_sign_in: ^7.2.0

  # Google Calendar is reached over its REST API with a bearer token from
  # google_sign_in's authorization half, rather than through googleapis: the
  # sink touches four event endpoints, and a hand-written client is a smaller
  # surface than a generated one for every Google API the package covers.
  # Already resolved transitively through Firebase; named here because lib/
  # imports it directly.
  http: ^1.6.0

  # Version is dictated by flutter_localizations' exact pin, so `any` is the
  # honest constraint. Named because generated l10n code imports it directly.
  intl: any

  # Zoned wall-clock time, required by flutter_local_notifications to schedule
  # anything: "Sunday at 9am" is a local time, not an instant, and only a
  # timezone database can turn one into the other across a DST boundary.
  timezone: ^0.11.1

dev_dependencies:
  auto_route_generator: ^10.6.0
  build_runner: ^2.15.1

  # In-memory Firebase backends for unit tests: repositories run against
  # fake_cloud_firestore, auth against firebase_auth_mocks. mock_exceptions
  # drives both of their error paths, so it is depended on directly rather
  # than reached transitively.
  fake_cloud_firestore: ^4.2.0
  firebase_auth_mocks: ^0.15.2

  flutter_test:
    sdk: flutter

  # Test-only, and already resolved transitively through google_sign_in: the
  # plugin's own types are needed to stand in for the native side, which has
  # no implementation under `flutter test`.
  google_sign_in_platform_interface: ^3.1.0

  mock_exceptions: ^0.8.2
  mocktail: ^1.0.5

  riverpod_lint: ^3.1.4
  very_good_analysis: ^10.3.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Run gen-l10n on pub get / build, per l10n.yaml.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Type and icons are bundled as font assets rather than pulled from packages,
  # so the app renders identically offline and in golden tests. Fraunces and
  # Inter are SIL OFL 1.1 and Phosphor is MIT; all three require the licence to
  # travel with the software, so each ships alongside its font.
  assets:
    # The Google mark for the sign-in button. Flutter picks the 2.0x/3.0x
    # variants beside this path on its own. BRANDING.txt travels with it: it
    # is a trademark used under Google's branding guidelines, not licensed
    # content, and the file records what may and may not be done with it.
    - assets/brand/google/g-logo.png
    - assets/brand/google/BRANDING.txt
    - assets/fonts/fraunces/OFL.txt
    - assets/fonts/inter/OFL.txt
    - assets/fonts/phosphor/LICENSE

  fonts:
    # Display face: the wordmark, page titles and app bar titles. One optical
    # size (72pt), one softness (Soft), one weight.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/fraunces/Fraunces72ptSoft-SemiBold.ttf
          weight: 600

    # Everything else, set as the theme's default family.
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600

    # Icons. The whole regular-weight face is bundled; release builds
    # tree-shake it down to the codepoints KithIcons actually names.
    - family: Phosphor
      fonts:
        - asset: assets/fonts/phosphor/Phosphor.ttf

include: package:very_good_analysis/analysis_options.yaml

analyzer:
  plugins:
    - riverpod_lint
  exclude:
    # AutoRoute output. The project's only build_runner codegen; never
    # hand-edited, never linted, never counted for coverage.
    - "**/*.gr.dart"

    # FlutterFire CLI output: platform app ids and API keys, rewritten wholesale
    # by `flutterfire configure`. Not build_runner codegen, but equally
    # off-limits to hand edits.
    - "lib/firebase_options.dart"
  errors:
    # Zero-warning policy: anything the analyzer reports fails the gate.
    todo: error

linter:
  rules:
    # Hand-written models declare `toMap`/`fromMap` returning dynamic-valued maps;
    # public_member_api_docs would demand doc comments on every field accessor.
    public_member_api_docs: false

    # Service seams are expressed as interfaces the composition root binds and
    # tests fake — `CalendarDirectory` has one method today because a directory
    # answers one question, not because it wants to be a function type.
    one_member_abstracts: false
